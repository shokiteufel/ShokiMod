# Rechnet die Marktdaten, die die Mod anzeigt: welche Pets sich zu leveln lohnen
# und welche Shard-Fusionen etwas abwerfen. Die Rechenarbeit passiert hier und nicht
# auf dem Rechner des Spielers - die Mod holt nur noch die fertigen Listen.
#
# Das Ergebnis liegt im Zweig "data", der bei jedem Lauf ueberschrieben wird. So
# waechst die Geschichte des Hauptzweigs nicht um zweitausend Eintraege im Monat.
#
# Beides laeuft bewusst in EINEM Lauf. Der Zweig wird ohne Vorgeschichte neu gesetzt
# und mit Gewalt geschoben; ein zweiter Ablaufplan daneben wuerde die Datei des
# ersten jedes Mal mitloeschen. Die Datei heisst weiterhin petprofit.yml, weil der
# Bot sie unter diesem Namen anstoesst (petprofit_trigger.py) - der Name ist
# Geschichte, der Inhalt macht beides.
name: Marktdaten (Pets und Shards)

on:
  schedule:
    # Alle zehn Minuten. Die Minuten stehen einzeln statt als */10: GitHub reiht
    # geplante Laeufe in eine gemeinsame Warteschlange ein und laesst sie bei Andrang
    # aus - je mehr Termine, desto eher kommt einer davon durch. Ein Lauf dauert
    # zwanzig Sekunden, kostet bei einem oeffentlichen Verzeichnis nichts und fragt
    # Hypixel sechsunddreissig Mal, was der offene Auktions-Zugang gut vertraegt.
    - cron: "0,10,20,30,40,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marktdaten
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-24.04
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v6

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Auktionshaus auswerten
        run: python tools/petprofit.py ausgabe/petprofit.json

      # Eine Sekunde Arbeit. Scheitert sie, soll die Pet-Liste trotzdem erscheinen -
      # deshalb bricht der Lauf hier nicht ab.
      #
      # Herausfallen zwei Dateien: die Rezepte (anderthalb Megabyte, aendern sich nur
      # bei einem Hypixel-Update) und die Preise (dreissig Kilobyte, jedes Mal neu).
      # Die Mod holt die grosse nur, wenn sich deren Kennung geaendert hat
      - name: Shard-Fusionen auswerten
        continue-on-error: true
        run: python tools/shardprofit.py ausgabe

      # Das Verzeichnis von NotEnoughUpdates: neun Megabyte gepackt, achttausend
      # Items. Die Rezepte aendern sich nur bei einem Hypixel-Update - der Lauf
      # kostet trotzdem nur eine Minute, und so bleibt alles in einem Durchgang
      - name: Handwerks-Rezepte auswerten
        continue-on-error: true
        run: python tools/craftprofit.py ausgabe/craftrecipes.json

      - name: Ergebnis veroeffentlichen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ein Zweig ohne Vorgeschichte: jeder Lauf ersetzt den vorigen Stand
          git checkout --orphan data
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 -mindepth 1 -not -name .git -not -name ausgabe -exec rm -rf {} +
          mv ausgabe/petprofit.json petprofit.json
          # Die Shard-Dateien nur, wenn ihr Schritt durchgekommen ist: Ohne diese
          # Pruefung risse ein Aussetzer bei SkyShards den ganzen Lauf mit
          for f in shardrecipes.json shardprices.json craftrecipes.json; do
            if [ -f "ausgabe/$f" ]; then
              mv "ausgabe/$f" "$f"
              git add "$f"
            fi
          done
          rmdir ausgabe
          git add petprofit.json
          git commit -m "Marktdaten vom $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force origin data
